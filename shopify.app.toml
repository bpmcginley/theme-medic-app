# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "45fc24d307ec26aaf6c32c1e230d5688"
name = "Theme Medic"
application_url = "https://theme-medic-app.onrender.com"
embedded = true

[access_scopes]
# read_themes: deep theme scan for ghost code (read-only, no exemption needed)
scopes = "read_themes"

[webhooks]
api_version = "2026-07"

# Restored for production (were removed during --use-localhost dev — Shopify
# rejects localhost webhook URIs; remove again if running `shopify app dev`).
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://theme-medic-app.onrender.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
